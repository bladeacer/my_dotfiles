# Managed by my_dotfiles (stowed to /etc via: sudo stow -t /etc sddm).
#
# EndeavourOS ships /etc/sddm.conf.d/10-endeavouros.conf with
# "InputMethod=qtvirtualkeyboard", which makes the Qt virtual keyboard
# pop up over the SDDM greeter — on a hi-DPI laptop screen it covers
# nearly the entire login page. This drop-in (sorted after 10-*.conf)
# overrides it. An empty InputMethod= is SDDM's default: no virtual
# keyboard. Delete this file to restore the EOS default.
[General]
InputMethod=
