# Managed by my_dotfiles (stowed to /etc via: sudo stow -t /etc sddm).
#
# EndeavourOS ships /etc/sddm.conf.d/10-endeavouros.conf (owned by the
# eos-breeze-sddm package) with "InputMethod=qtvirtualkeyboard", which makes
# SDDM export QT_IM_MODULE=qtvirtualkeyboard to the greeter. The Qt virtual
# keyboard then loads as the platform input context and pops up over the
# login page the moment the password field takes focus — on a hi-DPI screen
# it covers nearly the whole greeter.
#
# This drop-in (sorted after 10-*) overrides it with an empty InputMethod=,
# which is SDDM's own default: no input method, so the virtual keyboard
# plugin is never loaded.
#
# How SDDM resolves this (sddm 0.21, src/common/ConfigReader.cpp):
#   /usr/lib/sddm/sddm.conf.d/*  then  /etc/sddm.conf.d/*  then  /etc/sddm.conf
# Each directory is read in QDir::LocaleAware order and the last value of a
# key wins, so "99-" beats "10-". Verified: with this file in place the
# greeter does not load libqtvirtualkeyboardplugin.so at all.
#
# Note that SDDM's built-in default for InputMethod is "qtvirtualkeyboard"
# (src/common/Configuration.h), so this file is load-bearing, not
# belt-and-braces: if it goes missing the keyboard comes back.
#
# Delete this file to restore the EOS default.
[General]
InputMethod=
